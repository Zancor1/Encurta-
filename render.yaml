services:
  - type: web
    name: encurtai
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.9
      - key: DATABASE_PATH
        value: /var/data/links.sqlite3
    disk:
      name: encurtai-links
      mountPath: /var/data
      sizeGB: 1
